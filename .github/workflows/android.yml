name: Android Debug APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android and MAUI
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
          dotnet workload install maui-android
      - name: Restore solution
        run: dotnet restore BubbleTeaSimulator.slnx
      - name: Build solution and package Debug APK
        run: |
          dotnet build BubbleTeaSimulator.slnx -c Debug --no-restore \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
      - name: Run game and sensor tests
        run: dotnet test tests/BubbleTea.Tests/BubbleTea.Tests.csproj -c Debug --no-build --no-restore
      - name: Verify Debug APK signature
        run: |
          apk=src/BubbleTea.App/bin/Debug/net10.0-android36.0/com.samanmodheji.bubbletea-Signed.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
      - name: Verify portrait lock in packaged manifest
        run: |
          apk=src/BubbleTea.App/bin/Debug/net10.0-android36.0/com.samanmodheji.bubbletea-Signed.apk
          manifest=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          # Android 16+ ignores screenOrientation on tablets unless the app is a game (appCategory 0).
          if ! grep -Eq 'screenOrientation\(0x[0-9a-f]+\)=1$' <<<"$manifest" ||
             ! grep -Eq 'appCategory\(0x[0-9a-f]+\)=0$' <<<"$manifest" ||
             ! grep -q 'PROPERTY_COMPAT_ALLOW_RESTRICTED_RESIZABILITY' <<<"$manifest"; then
            echo "$manifest"
            echo "::error::Packaged manifest does not lock the app to portrait on large screens."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bubble-tea-debug-apk
          path: src/BubbleTea.App/bin/Debug/net10.0-android36.0/com.samanmodheji.bubbletea-Signed.apk
          if-no-files-found: error
